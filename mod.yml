title: Alice over Sora - Conservative Skirt and Grip Test v11
description: >-
  Corrective refinement of the v10 Alice-on-Sora model. Keeps the successful
  fixed Keyblade grip and validated v9 weapon pivot, restores the stable v9
  forearm and wrist mapping, and limits thigh-driven skirt movement to the
  middle three levels of Alice's narrow side chains. The waistband, hem,
  front, rear, and diagonal skirt chains remain pelvis-held. This visual-only
  test does not replace MSET, Lua, gameplay, collision events, effects, or
  weapon assets.
