title: Alice over Sora - Weapon Pivot Alignment Test v9
description: >-
  Narrow refinement of the stable v8 Alice-on-Sora re-rig. Moves Sora's
  Keyblade root to Alice's visible palm endpoint so the weapon and its native
  collision path better match her hand. Alice's v8 body, both remastered CVBL
  streams, textures, and rigid safety groups remain unchanged. This test does
  not replace MSET, Lua, gameplay, collision events, effects, or weapon assets.
