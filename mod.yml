title: Alice over Sora - Anatomy Pivot Alignment Test v7
description: >-
  Region-aware refinement of the stable v6 Alice-on-Sora re-rig. Aligns
  Alice's torso, shoulders, arms, palms, head, hips, and knees toward their
  mapped Sora bind pivots while keeping the shoes grounded and preserving the
  rigid skirt, hair, and finger safety groups. This isolated visual test does
  not replace MSET, Lua, gameplay, collision events, effects, or weapons.
