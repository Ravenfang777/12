title: Alice over Sora - Skirt, Grip and Forearm Test v10
description: >-
  Refinement of the validated v9 Alice-on-Sora model. Divides Alice's rigid
  skirt into pelvis-held front/rear/waist/hem regions and left/right side
  regions that follow the corresponding upper thighs. Reshapes the weapon
  hand into a fixed grip around the validated Keyblade root and improves the
  weapon forearm's elbow-to-wrist alignment. This visual-only test does not
  replace MSET, Lua, gameplay, collision events, effects, or weapon assets.
game: kh1
